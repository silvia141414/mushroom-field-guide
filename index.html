<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3d2a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="すーキノコ図鑑">
  <title>すーキノコ図鑑</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">MY MUSHROOM FIELD GUIDE</p>
        <h1>すーキノコ図鑑 🍄</h1>
      </div>
      <button id="installBtn" class="ghost-btn" type="button" hidden>ホーム画面へ</button>
    </header>

    <main>
      <section id="homeView" class="view active">
        <div class="hero-card">
          <div>
            <span class="hero-label">発見した種類</span>
            <strong id="speciesCount">0</strong>
          </div>
          <div>
            <span class="hero-label">発見記録</span>
            <strong id="recordCount">0</strong>
          </div>
          <div>
            <span class="hero-label">未同定</span>
            <strong id="unknownCount">0</strong>
          </div>
        </div>

        <div class="section-title-row">
          <h2>最近の発見</h2>
          <button class="text-btn" id="goLibraryBtn" type="button">全部見る</button>
        </div>
        <div id="recentList" class="card-list empty-state">まだ発見記録がありません。</div>
      </section>

      <section id="addView" class="view">
        <form id="recordForm">
          <div class="form-card">
            <h2>発見を記録</h2>

            <label class="photo-picker">
              <input id="photoInput" type="file" accept="image/*" >
              <img id="photoPreview" alt="" hidden>
              <span id="photoPlaceholder">📷 写真を追加</span>
            </label>

            <label>
              名前
              <input id="nameInput" type="text" placeholder="例：タマゴタケ / 未同定">
            </label>

            <div class="two-col">
              <label>
                成長段階
                <select id="stageInput">
                  <option value="不明">不明</option>
                  <option value="幼菌">幼菌</option>
                  <option value="成菌">成菌</option>
                  <option value="老菌">老菌</option>
                </select>
              </label>

              <label>
                判定
                <select id="categoryInput">
                  <option value="不明">不明</option>
                  <option value="食用">食用</option>
                  <option value="毒">毒</option>
                  <option value="要注意">要注意</option>
                </select>
              </label>
            </div>

            <label>
              発見日
              <input id="dateInput" type="date">
            </label>

            <label>
              場所
              <input id="placeInput" type="text" placeholder="例：道民の森 / ○○公園">
            </label>
            <div class="location-box">
            <button id="getLocationBtn" class="secondary-btn" type="button">
              📍 現在地を取得
            </button>

            <p id="locationStatus" class="muted">
            緯度・経度はまだ取得していません
          </p>
          </div>
          <div class="weather-box">
            <button id="getWeatherBtn" class="secondary-btn" type="button">
              🌥️ 過去14日間の天気を取得
            </button>

            <p id="weatherStatus" class="muted">
              天気データはまだ取得していません
            </p>

            <div id="weatherHistory"></div>
            </div>

            <label>
              メモ
              <textarea id="memoInput" rows="4" placeholder="周囲の木、湿り気、個体数、気づいたことなど"></textarea>
            </label>

            <div id="extraMushrooms"></div>

            <button id="addMushroomBtn" class="secondary-btn" type="button"> + キノコを追加</button>
            <button class="primary-btn" type="submit">この発見を保存</button>
            <p id="saveMessage" class="save-message" aria-live="polite"></p>
          </div>
        </form>
      </section>

      <section id="libraryView" class="view">
        <div class="section-title-row">
          <h2>図鑑</h2>
          <span id="libraryCount" class="muted"></span>
        </div>

        <div class="filters">
          <input id="searchInput" type="search" placeholder="キノコ名・場所・メモを検索">
          <select id="filterInput">
            <option value="all">すべて</option>
            <option value="unknown">未同定だけ</option>
            <option value="food">食用</option>
            <option value="poison">毒</option>
          </select>
        </div>

        <div id="libraryList" class="grid-list empty-state">まだ図鑑が空です。</div>
      </section>

      <section id="settingsView" class="view">
        <div class="form-card">
          <div class="form-card auth-card">
  <h2>☁️ クラウド同期</h2>

  <p id="authStatus" class="muted">
    ログインしていません
  </p>

  <div id="loginArea">
    <label>
      メールアドレス
      <input
        id="loginEmail"
        type="email"
        autocomplete="email"
        placeholder="メールアドレス"
      >
    </label>

    <label>
      パスワード
      <input
        id="loginPassword"
        type="password"
        autocomplete="current-password"
        placeholder="パスワード"
      >
    </label>

    <button
      id="loginBtn"
      class="primary-btn"
      type="button"
    >
      ログイン
    </button>
  </div>

  <button
    id="logoutBtn"
    class="secondary-btn"
    type="button"
    hidden
  >
    ログアウト
  </button>
  <button
  id="syncBtn"
  class="primary-btn"
  type="button"
>
  ☁️ 今すぐ同期
</button>

<button
  id="pullBtn"
  class="secondary-btn"
  type="button"
>
  ☁️ クラウドから読み込む
</button>

<p id="syncStatus" class="muted"></p>
</div>
          <h2>データ</h2>
          <p class="muted">現在はこの端末に保存します。PCとの同期は次の段階で追加します。</p>
          <button id="exportBtn" class="secondary-btn" type="button">JSONを書き出す</button>
          <label class="secondary-btn file-btn">
            JSONを読み込む
            <input id="importInput" type="file" accept="application/json">
          </label>
          <button id="clearBtn" class="danger-btn" type="button">全データ削除</button>
          <p id="settingsMessage" class="save-message" aria-live="polite"></p>
        </div>

        <div class="form-card install-help">
          <h2>iPhoneでアプリ化</h2>
          <p>Safariでこのページを開いて、共有 → 「ホーム画面に追加」でアイコンから起動できます。</p>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="メインメニュー">
      <button class="nav-btn active" data-view="homeView" type="button"><span>🏠</span>ホーム</button>
      <button class="nav-btn add-nav" data-view="addView" type="button"><span>＋</span>記録</button>
      <button class="nav-btn" data-view="libraryView" type="button"><span>🍄</span>図鑑</button>
      <button class="nav-btn" data-view="settingsView" type="button"><span>⚙️</span>設定</button>
    </nav>
  </div>

  <dialog id="detailDialog">
    <article id="detailContent"></article>
    <form method="dialog">
      <button class="secondary-btn" type="submit">閉じる</button>
    </form>
  </dialog>

 
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js?v=4"></script>
</body>
</html>
